name: contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # The CI profile raises fuzz to 2,000 runs and invariants to 512 — worth
      # the minutes here, too slow for the inner loop.
      - name: Test
        run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci
