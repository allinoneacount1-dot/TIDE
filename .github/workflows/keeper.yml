name: keeper

# One execution pass on a schedule.
#
# Robinhood Chain has neither Chainlink Automation nor Gelato, so this is a
# genuine option rather than a convenience. Two caveats worth knowing before
# relying on it:
#
#   · GitHub delays scheduled workflows under load, commonly by 5–20 minutes.
#     Irrelevant for weekly or monthly cadences; unsuitable for hourly ones.
#   · Scheduled workflows are disabled automatically after 60 days without
#     repository activity.
#
# For tighter cadences, run keeper/ on a small VPS instead.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two passes race for the same nonce.
  group: keeper
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    # Remove this line to enable. It is off by default so a fork does not start
    # signing transactions on someone's behalf.
    if: ${{ vars.KEEPER_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - run: npm ci --omit=dev || npm install --omit=dev
        working-directory: keeper

      - name: Run one pass
        working-directory: keeper
        env:
          RPC_URL: ${{ secrets.KEEPER_RPC_URL }}
          CHAIN_ID: ${{ vars.KEEPER_CHAIN_ID }}
          REGISTRY_ADDRESS: ${{ vars.KEEPER_REGISTRY_ADDRESS }}
          SIMULATED_ROUTER: ${{ vars.KEEPER_SIMULATED_ROUTER }}
          # A hot key holding gas and nothing else. A leak here is a denial of
          # service and a gas bill — the keeper cannot withdraw and cannot
          # execute below a vault's on-chain floor.
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          MAX_GAS_GWEI: ${{ vars.KEEPER_MAX_GAS_GWEI || '5' }}
        run: npm run once
